name: Desktop build

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: Windows-x64
          - os: macos-15
            artifact: macOS-Apple-Silicon
          - os: macos-15-intel
            artifact: macOS-Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt -e ".[dev]"
      - name: Fetch pinned official engine
        run: python scripts/fetch_engine.py
      - name: Test extraction and desktop UI
        run: python -m pytest -q
      - name: Build desktop application
        run: python scripts/build.py
      - name: Test packaged application
        run: python scripts/smoke_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: NeoResourceUnpackTool-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verification-${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: ignore
